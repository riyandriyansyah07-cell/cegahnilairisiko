services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "${APP_NAME:-Cegah Sebelum Terlambat}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:?Set APP_KEY di .env}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-peringatan_dini}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD di .env}"
      PSEUDONYM_SALT: "${PSEUDONYM_SALT:?Set PSEUDONYM_SALT di .env}"
      RISK_ENGINE: "${RISK_ENGINE:-http}"
      RISK_SERVICE_URL: "http://ml-service:8001"
      RISK_SERVICE_TOKEN: "${RISK_SERVICE_TOKEN:?Set RISK_SERVICE_TOKEN di .env}"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ML_ENV: "${APP_ENV:-production}"
      RISK_SERVICE_TOKEN: "${RISK_SERVICE_TOKEN:?Set RISK_SERVICE_TOKEN di .env}"
    volumes:
      - ml_models:/app/models
    expose:
      - "8001"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-peringatan_dini}"
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD di .env}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-peringatan_dini}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  ml_models:
